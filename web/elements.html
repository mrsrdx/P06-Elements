<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Web Elements</title>
<style>body{font:18px Arial,sans-serif;max-width:900px;margin:40px auto;padding:20px}input,select,button{font:inherit;margin:6px;padding:6px}table{border-collapse:collapse}th,td{border:1px solid #aaa;padding:10px}[hidden]{display:none}</style>
</head><body><h1>Web elements</h1><label>Name <input id="name"></label><br>
<label><input type="radio" name="gender" id="female"> Female</label>
<label><input type="radio" name="gender" id="male"> Male</label><br>
<label><input type="checkbox" id="sports"> Sports</label>
<select id="color"><option>Red</option><option>Purple</option></select>
<button id="alert" onclick="alert('Hello '+document.getElementById('name').value)">Show alert</button>
<p><iframe title="Notes" id="notesFrame" src="frame.html"></iframe></p>
<button id="load" onclick="setTimeout(()=>document.getElementById('result').textContent='Ready',700)">Load result</button>
<p id="result"></p></body></html>
